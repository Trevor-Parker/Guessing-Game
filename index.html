<!DOCTYPE HTML>
<html lang = "en">
<head>
  <meta name="viewport" content="width=device-width"> 
  <meta name="author" content="Trevor Parker"> 
  <meta charset="UTF-8">
  <title>Guessing Game</title>
</head>
<!-- defines time, encoding, author name, title -->
<body>
  <script>
    randomNumber = Math.floor(Math.random() * 10) +1;
    document.getElementById("Random").innerHTML = randomNumber;
    console.log(randomNumber);
//The computer generates a random number and saves it
    let yourNumber = Number(prompt("Please enter a number between 1 to 10"));
      console.log(yourNumber);
//The player chooses their number
    for (let i = 0; i++) {
      if (yourNumber === randomNumber) {
        alert("You guessed it in" + i + "guesses");
        break;
      }
//Defining winning conditions
      else if (yourNumber > randomNumber) {
        alert("Your guess was too high, guess again")
              }
      else {
        alert("Your guess was too low, guess again.")
              }
//Defining too low and too high
      }
  </script>
</body>
</html>
